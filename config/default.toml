# Default parameters for the OCR pipeline. Code reads these values; do not hardcode them.

[regions]
# An image (or a set of images) covering at least this fraction of the page is a scanned page.
scan_min_coverage = 0.85
# ... and has at most this many visible native text objects (invisible OCR layers do not count).
scan_max_visible_text_objects = 0
# Images smaller than this (either side, in pt) are decoration (bullets, spacers) and ignored.
min_image_side_pt = 8.0
# Images covering less than this fraction of the page are classified as logos.
logo_max_page_fraction = 0.01
# Vector paths covering more than this fraction of the page are backgrounds/frames and ignored.
path_max_page_fraction = 0.5
# A path thinner than this (pt) in one dimension is a rule (table line, underline, separator).
rule_max_thickness_pt = 2.0
# Rules spanning at least this fraction of the page width are page separators and ignored.
separator_min_page_width_fraction = 0.8
# Paths closer than this gap (pt) belong to the same vector cluster.
cluster_gap_pt = 12.0
# A vector cluster becomes a vector_diagram only with at least this many paths ...
diagram_min_paths = 4
# ... of which at least this many have a curve or a diagonal segment (arrowheads, connectors,
# rounded corners). Clusters of only horizontal/vertical lines are tables or shaded boxes.
diagram_min_shaped_paths = 1
# ... and at least this area as a fraction of the page.
diagram_min_page_fraction = 0.01
# Text objects within this margin (pt) of a diagram, above/below or beside it, are its labels.
label_margin_pt = 6.0
# An image whose area lies at least this fraction inside a diagram is absorbed by it.
absorb_min_overlap = 0.9
# Above this many paths on one page, clustering falls back to a single page-wide cluster.
max_paths_per_page = 20000

[render]
dpi = 300

[svg_gt]
# SVGs are rendered so that their longer side has about this many pixels ...
target_long_side_px = 2000
# ... but never scaled below/above these factors (CSS px -> image px).
min_scale = 0.5
max_scale = 4.0
# Words rendered smaller than this (font size in image px) are kept but marked illegible.
min_legible_font_px = 8.0
# Words with less than this fraction of their box inside the image are dropped.
min_visible_fraction = 0.5
# Diagrams with fewer Latin letters than this fraction (e.g. Japanese) are skipped.
min_latin_letter_fraction = 0.9

[tesseract]
# Languages and models. tessdata_dir = "" uses the system tessdata (Ubuntu: tessdata_fast).
lang = "pol+eng"
oem = 1
# Page segmentation for whole images: 11 = sparse text (diagram labels), 3 = automatic.
psm = 11
# Page segmentation for recognize() on given boxes: 7 = single text line.
recognize_psm = 7
recognize_pad_px = 4
tessdata_dir = ""
timeout_s = 120

[eval]
# A predicted and a ground-truth word match when their intersection covers at least this
# fraction of the smaller box (predicted boxes are tight, ground-truth boxes span the line).
match_min_overlap = 0.5
# A ground-truth word counts as detected when predicted words cover this fraction of its length.
detect_min_coverage = 0.5
calibration_bins = 10
# Confidence thresholds for the accepted / review trade-off table.
accept_thresholds = [0.0, 0.5, 0.6, 0.7, 0.8, 0.85, 0.9, 0.95, 0.97, 0.99]
# How many mismatched words to keep in a report for error analysis.
max_error_examples = 300
