# Default parameters for the OCR pipeline. Code reads these values; do not hardcode them.

[regions]
# An image (or a set of images) covering at least this fraction of the page is a scanned page.
scan_min_coverage = 0.85
# ... and has at most this many visible native text objects (invisible OCR layers do not count).
scan_max_visible_text_objects = 0
# Images smaller than this (either side, in pt) are decoration (bullets, spacers) and ignored.
min_image_side_pt = 8.0
# Images covering less than this fraction of the page are classified as logos.
logo_max_page_fraction = 0.01
# Vector paths covering more than this fraction of the page are backgrounds/frames and ignored.
path_max_page_fraction = 0.5
# A path thinner than this (pt) in one dimension is a rule (table line, underline, separator).
rule_max_thickness_pt = 2.0
# Rules spanning at least this fraction of the page width are page separators and ignored.
separator_min_page_width_fraction = 0.8
# Paths closer than this gap (pt) belong to the same vector cluster.
cluster_gap_pt = 12.0
# A vector cluster becomes a vector_diagram only with at least this many paths ...
diagram_min_paths = 4
# ... of which at least this many have a curve or a diagonal segment (arrowheads, connectors,
# rounded corners). Clusters of only horizontal/vertical lines are tables or shaded boxes.
diagram_min_shaped_paths = 1
# ... and at least this area as a fraction of the page.
diagram_min_page_fraction = 0.01
# Text objects within this margin (pt) of a diagram, above/below or beside it, are its labels.
label_margin_pt = 6.0
# An image whose area lies at least this fraction inside a diagram is absorbed by it.
absorb_min_overlap = 0.9
# Above this many paths on one page, clustering falls back to a single page-wide cluster.
max_paths_per_page = 20000

[render]
dpi = 300

[svg_gt]
# SVGs are rendered so that their longer side has about this many pixels ...
target_long_side_px = 2000
# ... but never scaled below/above these factors (CSS px -> image px).
min_scale = 0.5
max_scale = 4.0
# Words rendered smaller than this (font size in image px) are kept but marked illegible.
min_legible_font_px = 8.0
# Words with less than this fraction of their box inside the image are dropped.
min_visible_fraction = 0.5
# Diagrams with fewer Latin letters than this fraction (e.g. Japanese) are skipped.
min_latin_letter_fraction = 0.9
# Pieces of text on one line closer than this (in em) are one word; a space is ~0.25-0.3 em.
glue_gap_em = 0.12
# ... or closer than this when the source has no whitespace between them.
glue_gap_no_space_em = 0.3
# A piece of text is visible when its paint colour differs from the colour around its box by
# more than ink_threshold (0-255, any channel). Without a plain colour (gradients): when its box
# has at least ink_min_pixels (and ink_min_fraction) pixels that far from the box's median.
ink_threshold = 48
ink_min_pixels = 3
ink_min_fraction = 0.002
# A shape drawn over text hides it only if its fill is at least this opaque (0-1).
occluder_min_alpha = 0.6

[tesseract]
# Languages and models. tessdata_dir = "" uses the system tessdata (Ubuntu: tessdata_fast).
lang = "pol+eng"
oem = 1
# Page segmentation for whole images: 11 = sparse text (diagram labels), 3 = automatic.
psm = 11
# Page segmentation for recognize() on given boxes: 7 = single text line.
recognize_psm = 7
recognize_pad_px = 4
# Enlarge crops whose shorter side is below this many pixels (0 = never), at most max_scale.
# Off: on 200 diagrams (2026-10-21) it added false alarms and let more errors through.
recognize_min_height_px = 0
recognize_max_scale = 4.0
# Also try crops at least this many times taller than wide rotated by 90 and 270 degrees
# (vertical text); the reading with the higher confidence wins. 0 = never.
# Off: on 200 diagrams it removed 6 of 866 false alarms but let 10 more errors through.
rotate_min_aspect = 0.0
# Parallel tesseract processes for recognize().
workers = 6
tessdata_dir = ""
timeout_s = 120

[eval]
# How readings are compared with the ground truth:
# "align" - character alignment inside groups of overlapping boxes (word splits and box
#           placement do not count as reading errors); "word" - one-to-one word matching.
matching = "align"
# A ground-truth word and a reading belong to one group when their boxes overlap by at least
# this fraction of the smaller box.
group_min_overlap = 0.2
# Neighbouring ground-truth words of one line join one group when they are at most this many
# line heights apart (word spacing is about 0.3).
group_line_gap = 0.8
# Box accuracy: a pixel is ink when it differs from the box border's colour by more than this,
# and a word is fully covered when at least this fraction of its ink is inside the reading boxes.
box_ink_threshold = 60
box_full_coverage = 0.99
# A predicted and a ground-truth word match when their intersection covers at least this
# fraction of the smaller box (predicted boxes are tight, ground-truth boxes span the line).
match_min_overlap = 0.5
# A ground-truth word counts as detected when predicted words cover this fraction of its length.
detect_min_coverage = 0.5
calibration_bins = 10
# Confidence thresholds for the accepted / review trade-off table.
accept_thresholds = [0.0, 0.5, 0.6, 0.7, 0.8, 0.85, 0.9, 0.95, 0.97, 0.99]
# What is scored (decided 2026-10-22: what will never be anonymised is not scored):
# - typographic variants nobody can tell apart in a picture count as equal (’ ‘ ′ -> ',
#   “ ” „ ″ -> ", – — − ‐ -> -, … -> ...);
normalize_typography = true
# - these characters are stripped from both ends of every word, in the ground truth and in
#   the readings (punctuation inside a word stays: 10.0.0.1, j.kowalski@example.com);
strip_edge_chars = ".,;:!?()[]{}\"'*-"
# - words without a letter or digit ("<>" read from an icon, "++", "—") are not scored (2026-10-23);
require_alnum = true
# - words shorter than this after that are not scored, and readings that short are dropped.
min_scored_chars = 2
# How many mismatched words to keep in a report for error analysis.
max_error_examples = 300

[paddle]
# PaddleOCR models run through RapidOCR (ONNX Runtime or OpenVINO), stored in model_root_dir.
model_root_dir = "artifacts/models/rapidocr"
# PP-OCRv6 medium: best detection and Polish in the first measurement (2026-10-20).
# PP-OCRv6 has one multilingual model per task; the *_lang values only route to it
# (PP-OCRv5 alternative: det_lang "multi", rec_lang "latin", model types "mobile").
ocr_version = "PP-OCRv6"
det_model_type = "medium"
det_lang = "ch"
rec_model_type = "medium"
rec_lang = "en"
use_cls = true
# Keep every line, even with a low score: low confidence means review, not deletion.
text_score = 0.0
# Detection input: short side scaled to at least det_limit_side_len (limit_type "min").
det_limit_side_len = 736
det_limit_type = "min"
det_thresh = 0.3
det_box_thresh = 0.5
det_unclip_ratio = 1.6
# Images with a longer side are downscaled before detection.
max_side_len = 2000
recognize_pad_px = 4
# Snap word boxes to the ink of each word (ocr/box_refine.py, parameters in [box_refine]).
# RapidOCR's word boxes come from CTC columns and cut into first/last letters (docs/boxes.md).
refine_boxes = true
# Inference threads; -1 lets the runtime decide.
threads = -1

[consensus]
# The primary engine finds the words (best detection); the secondary reads the same boxes.
primary = "paddle_openvino"
secondary = "tesseract"
# Agreement is accepted outright only if both engines are at least this confident.
primary_min_conf = 0.5
secondary_min_conf = 0.5
# On disagreement both engines read the word again from a crop enlarged this many times ...
reread_scale = 2.0
reread_pad_px = 6
# ... and the word is accepted if at least this many of the 4 readings are identical.
reread_min_votes = 3
# The majority may overrule the primary engine's first reading only if its length differs
# from it by at most this many characters; otherwise the word goes to review. All four
# readings see the same crop: when the box holds only part of a word, they can agree on the
# fragment ('"i -> se>", for EncryptResponse>",). -1 = no limit.
reread_max_length_change = 1
# Nor may it drop letters or digits from the primary reading's edges ("Linux" -> "inux"): a box
# that cuts the word's first or last letter makes every re-read agree on the cut word. Dropping
# edge punctuation ("-Begin" -> "Begin") is still allowed.
reread_keep_edge_letters = true
# Characters the secondary engine (Tesseract) adds at the edges of word crops, where frames
# and lines touch the text ("Azure |", "Private."). A secondary reading that equals the primary
# one without them counts as agreement, unless the primary reading has them at its own edges.
# Empty = exact comparison.
secondary_edge_junk = "|!'\"‘’“”„_.,;:«»`~"
# Nor does a single character the secondary engine reads apart, after a space, at either edge
# of a one-word crop: a sliver of the neighbouring word or of a line ("Understand 1", "cache i").
secondary_edge_tokens = true
# Send to review even when the engines agree (both engines make these errors the same way):
# - glyphs that look alike in UI fonts next to the "other" case or class: Al/AI, loT/IoT,
#   MDT0/MDTO, v1/vl;
flag_ambiguous_glyphs = true
# - a dash at the start or end of a word, usually a diagram line touching the text.
flag_edge_dashes = true
# Also report text that only the secondary engine found (as uncertain, for review).
# Off by default: Tesseract reads many icons as text.
secondary_detection = false
# A secondary-only word must not overlap a primary word by more than this (smaller-box fraction).
secondary_max_overlap = 0.3

[box_refine]
# Word boxes snapped to ink (ocr/box_refine.py). Lengths are in line heights (the detector's
# line box), text heights (the glyphs' height) or character pitches, as named.
# Line boxes tilted less than this (degrees) from horizontal/vertical are treated as straight.
axis_snap_deg = 5.0
# Search window around the line box, in line heights.
expand_across = 0.45
expand_along = 0.6
# Ink: share of the text contrast a pixel needs to seed a glyph (strong) or to extend it (weak).
strong_ink = 0.5
weak_ink = 0.2
# Lines with less contrast (0-255, max over RGB) keep their prior boxes.
min_contrast = 40.0
# Ink must be a blend of background and text colour (within colour_tolerance of the text
# contrast): an orange connector or a blue icon touching black text is not part of a word.
text_colour_model = true
colour_tolerance = 0.25
# Pixels this close (px) to text ink and far enough from the background count as ink whatever
# their colour: the coloured fringes of subpixel-rendered (ClearType) text. 0 = off.
fringe_px = 1
# Horizontal / vertical runs at least this long (text heights) are rules and are removed.
rule_h_len = 2.0
rule_v_len = 1.5
# Thin (at most max_rule_width text heights) and tall (at least min_rule_height times the tallest
# letters) ink is the side of a frame drawn close around the text, not a letter: "l", "I" and "|"
# are lower.
max_rule_width = 0.12
min_rule_height = 1.35
# A glyph's vertical centre lies within this many line heights of the line box's centre.
glyph_centre_band = 0.32
# Glyphs are at most this tall; marks (accents, dots) at most max_mark_height and at most
# max_mark_gap above the glyph they belong to (text heights).
max_glyph_height = 1.8
max_mark_height = 0.6
max_mark_gap = 0.35
# Assignment of glyphs to words: weights of the distance to the prior edges (in pitches), of
# wide gaps at word boundaries and of wide gaps inside a word; prior widening (pitches) inside
# which a glyph must be used; at most this many glyphs left out between two words.
w_prior = 1.0
w_boundary_gap = 5.0
w_inner_gap = 3.0
prior_slack_pitch = 0.25
max_skip_between = 3
# A word whose glyphs are centred more than this (pitches) outside its prior means the
# assignment slipped; the line is then assigned glyph by glyph to the prior holding it.
shift_check_pitch = 0.5
# Unassigned glyphs closer than this (text heights) to a word join it.
letter_gap = 0.25
# Boxes grow by up to this much (text heights) into ink touching them.
grow_into_ink = 0.15
# Extra margin for lines that are neither horizontal nor vertical (resampled strip).
rotated_margin = 0.1
# A snapped edge farther than this from the prior (pitches, plus half a text height) falls back.
max_shift_pitch = 1.5
# Margin added to snapped boxes (px), and to fallback boxes (pitches / line heights).
# 1 px: over half of the boxes that missed ink missed one antialiased column or row
# (dev 2026-10-23: full boxes 91.8% -> 96.5%, boxes holding >=5% of other words' ink 2.5% -> 2.7%).
margin_px = 1.0
fallback_margin_pitch = 0.5
fallback_margin_height = 0.1
