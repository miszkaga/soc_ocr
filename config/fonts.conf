<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Font substitutions for rendering public SVG diagrams (eval/svg_ground_truth.py).
  Used only by that renderer via FONTCONFIG_FILE; the system configuration is untouched.

  Without these, Chromium renders families it cannot find (Segoe UI in Azure diagrams)
  with its default serif font, which looks nothing like the real diagrams.
  Strong bindings make Chromium accept the substitute as the requested family.
  Selawik is Microsoft's metric-compatible open replacement for Segoe UI (OFL-1.1),
  stored in artifacts/fonts/selawik (see artifacts/datasets/SOURCES.md).
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir prefix="relative">../artifacts/fonts</dir>

  <match target="pattern">
    <test name="family"><string>Segoe UI</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Selawik</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Segoe UI Semibold</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Selawik Semibold</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Segoe UI Light</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Selawik Light</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Segoe UI Semilight</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Selawik Semilight</string></edit>
  </match>

  <!-- Narrower UI fonts (labels were laid out for them): Arial-metric Liberation Sans, so text
       still fits its shapes. Wider ones: Noto Sans (Open Sans has nearly the same design). -->
  <match target="pattern">
    <test name="family"><string>trebuchet ms</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Liberation Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Trebuchet MS</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Liberation Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Calibri</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Liberation Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Carlito</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Liberation Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Aptos</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Verdana</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Tahoma</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Open Sans</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Open-Sans</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Bitstream Vera Sans</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Sans</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Roboto</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Lato</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans</string></edit>
  </match>
</fontconfig>
